listener {
    timeout = 1200                                     # 20 minutes
    on-timeout = noctalia-shell ipc call lockScreen lock           # lock screen
    ignore_inhibit = true
}

listener {
    # Noctalia has a 10s lock countdown in settings.json, so leave a small
    # buffer after the lock starts before powering monitors off.
    timeout = 1230                                    # 20 minutes 30 seconds
    on-timeout = niri msg action power-off-monitors    # DPMS off after lock
    on-resume = niri msg action power-on-monitors      # DPMS on on activity
    ignore_inhibit = true
}

