general {
    lock_cmd = noctalia-shell ipc call lockScreen lock              # avoid starting multiple instances
    before_sleep_cmd = noctalia-shell ipc call lockScreen lock      # lock before suspend
    after_sleep_cmd = niri msg action power-on-monitors             # wake displays after suspend
    ignore_dbus_inhibit = true                        # force lock even when apps leave stale inhibitors
}

listener { 
    timeout = 180                                                      # 3 minutes
    # List devices: brightnessctl --list
    # Adjust keyboard backlight: brightnessctl -d kbd_backlight set 50%
    on-timeout = sh -c 'brightnessctl --list | grep -q "Device .kbd_backlight." && brightnessctl --save --device=kbd_backlight set 0 || true'
    on-resume = sh -c 'brightnessctl --list | grep -q "Device .kbd_backlight." && brightnessctl --restore --device=kbd_backlight || true'
}

